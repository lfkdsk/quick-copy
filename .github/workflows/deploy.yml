name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Pages needs id-token to mint the deployment, and read access to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather
# than cancelling it — a half-deployed Pages site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # public/CNAME is what decides where the site is served from: with a
      # custom domain Pages serves it at the root, without one at
      # /<repo>/. Deriving the base path from the same file keeps the two
      # from drifting apart and silently 404-ing every asset.
      - name: Resolve base path
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "Custom domain: $(cat public/CNAME) — building for /"
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "No custom domain — building for /${{ github.event.repository.name }}/"
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
